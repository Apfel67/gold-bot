name: gold-bot

on:
  schedule:
    - cron: "3 * * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Was soll der Bot tun?"
        type: choice
        default: run
        options: [run, status, test-push, resume, backtest]

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bot ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            run)       python bot.py ;;
            status)    python bot.py --status ;;
            test-push) python bot.py --test-push ;;
            resume)    python bot.py --resume ;;
            backtest)  python bot.py --backtest --out backtest_trades.csv ;;
          esac

      - name: Backtest-Ergebnis bereitstellen
        if: github.event.inputs.mode == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest_trades
          path: backtest_trades.csv

      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add state/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bot-Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
