# Gehört in den Ordner .github/workflows/ deines Repos.
# Läuft viermal pro Stunde von Sonntag bis Freitag, solange Gold-Futures
# gehandelt werden. GitHub verzögert oder verwirft geplante Läufe bei hoher
# Last (besonders zur vollen Stunde); mehrere Termine abseits der vollen
# Stunde machen den Bot robust. Läufe ohne neue Kerze tun nichts und
# ändern den Zustand nicht.
name: gold-bot

on:
  schedule:
    - cron: "11,26,41,56 * * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Was soll der Bot tun?"
        type: choice
        default: run
        options: [run, status, test-push, resume, backtest, robustness, history]
      von:
        description: "Nur für history: erstes Testjahr"
        default: "2010"
      bis:
        description: "Nur für history: letztes Testjahr"
        default: "2023"

permissions:
  contents: write

# Analysen (backtest, robustness, history) ändern den Zustand nicht und blockieren
# deshalb den Live-Bot nicht.
concurrency:
  group: ${{ contains(fromJSON('["backtest","robustness","history"]'), github.event.inputs.mode) && 'gold-bot-analyse' || 'gold-bot-live' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bot ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          VON: ${{ github.event.inputs.von || '2010' }}
          BIS: ${{ github.event.inputs.bis || '2023' }}
        run: |
          case "$MODE" in
            run)       python bot.py ;;
            status)    python bot.py --status ;;
            test-push) python bot.py --test-push ;;
            resume)    python bot.py --resume ;;
            backtest)  python bot.py --backtest --out backtest_trades.csv ;;
            robustness) python bot.py --robustness --out robustness.csv ;;
            history)   python bot.py --history --von "$VON" --bis "$BIS" --out history ;;
          esac

      - name: Backtest-Ergebnis bereitstellen
        if: github.event.inputs.mode == 'backtest'
        uses: actions/upload-artifact@v6
        with:
          name: backtest_trades
          path: backtest_trades.csv

      - name: Robustheits-Tabelle bereitstellen
        if: github.event.inputs.mode == 'robustness'
        uses: actions/upload-artifact@v6
        with:
          name: robustness
          path: robustness.csv

      - name: Ergebnisse mit alten Daten bereitstellen
        if: github.event.inputs.mode == 'history'
        uses: actions/upload-artifact@v6
        with:
          name: history
          path: history/

      - name: Zustand speichern
        if: always() && !contains(fromJSON('["backtest","robustness","history"]'), github.event.inputs.mode)
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add state/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bot-Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
